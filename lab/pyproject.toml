[project]
name = "epistemic-lab"
version = "0.1.0"
description = "Review game, plus-factor auditors, and metrics for studying collusion versus correlated agreement in multi-agent AI."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "transformers>=4.45",
    "scikit-learn>=1.5",
]
dev = [
    "pytest>=8",
    "jupytext>=1.16",
    "matplotlib>=3.9",
]

[project.scripts]
elab = "epistemic_lab.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epistemic_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
default-groups = []
